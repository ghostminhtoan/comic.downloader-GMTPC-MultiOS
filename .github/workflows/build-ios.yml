name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Show & Select Xcode Toolchain
        run: |
          echo "=== Available Xcode versions ==="
          ls -ld /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.0.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS Workload
        run: |
          dotnet workload install ios --skip-manifest-update

      - name: Nullify _CheckForInvalidXcodeVersion Target in SDK
        run: |
          python3 -c "
          import glob, re, os

          patterns = [
              os.path.expanduser('~/.dotnet/packs/Microsoft.iOS.Sdk*/**/*.targets'),
              '/Users/runner/.dotnet/packs/Microsoft.iOS.Sdk*/**/*.targets'
          ]
          
          for pattern in patterns:
              for path in glob.glob(pattern, recursive=True):
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      # Thay thế toàn bộ target thành target rỗng (vô hiệu hóa C# task bên trong)
                      new_content = re.sub(r'<Target\s+Name=[\"\']_CheckForInvalidXcodeVersion[\"\'][\s\S]*?</Target>', '<Target Name=\"_CheckForInvalidXcodeVersion\" />', content)
                      new_content = re.sub(r'<Target\s+Name=[\"\']_CheckForInvalidMacCatalystXcodeVersion[\"\'][\s\S]*?</Target>', '<Target Name=\"_CheckForInvalidMacCatalystXcodeVersion\" />', new_content)
                      new_content = re.sub(r'<CheckForInvalidXcodeVersion[\s\S]*?/>', '', new_content)
                      if new_content != content:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                          print(f'Successfully nullified target in: {path}')
                  except Exception as e:
                      print(f'Error: {e}')
          "

      - name: Restore Dependencies
        run: |
          dotnet restore ComicDownloaderGMTPC.iOS/ComicDownloaderGMTPC.iOS.csproj

      - name: Build iOS App (Ad-Hoc Signed)
        run: |
          dotnet build ComicDownloaderGMTPC.iOS/ComicDownloaderGMTPC.iOS.csproj -c Release -r ios-arm64 --no-restore -v n -p:_SuppressXcodeVersionCheck=true -p:SuppressXcodeVersionCheck=true -p:CodesignKey="-" -p:EnableCodeSigning=true

      - name: Package Unsigned / Ad-Hoc IPA (For Sideload / AltStore / TrollStore / Sideloadly)
        run: |
          mkdir -p Payload
          APP_PATH=$(find ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64 -type d -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found App Bundle at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r ComicDownloaderGMTPC-iOS-AdHoc.ipa Payload
          else
            echo "Searching in publish directory..."
            APP_PATH=$(find ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64/publish -type d -name "*.app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              cp -R "$APP_PATH" Payload/
              zip -r ComicDownloaderGMTPC-iOS-AdHoc.ipa Payload
            else
              echo "App bundle not found! Creating zip of build output directory."
              zip -r ComicDownloaderGMTPC-iOS-BuildOutput.zip ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64/
            fi
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-iOS
          path: |
            *.ipa
            ComicDownloaderGMTPC-iOS-BuildOutput.zip
          retention-days: 14
