name: Build All Platforms (Windows, Linux, Android, iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── 1. WINDOWS STANDALONE EXE ──
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows Standalone Single-File
        run: |
          dotnet publish ComicDownloaderGMTPC.Desktop\ComicDownloaderGMTPC.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish\windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Windows-x64
          path: publish\windows\ComicDownloaderGMTPC.Desktop.exe
          retention-days: 14

  # ── 2. LINUX STANDALONE BINARY ──
  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux Standalone Single-File
        run: |
          dotnet publish ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Linux-x64
          path: publish/linux/ComicDownloaderGMTPC.Desktop
          retention-days: 14

  # ── 3. ANDROID APK PACKAGE ──
  build-android:
    name: Build Android (APK)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Workload
        run: |
          dotnet workload install android --skip-manifest-update

      - name: Build Android Release Package
        run: |
          dotnet build ComicDownloaderGMTPC.Android\ComicDownloaderGMTPC.Android.csproj -c Release -o publish\android

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Android-APK
          path: publish\android\*-Signed.apk
          retention-days: 14

  # ── 4. IOS APP & IPA ──
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Show & Select Xcode Toolchain
        run: |
          echo "=== Available Xcode versions ==="
          ls -ld /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            echo "Selected Xcode 16.0"
            echo "DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer" >> $GITHUB_ENV
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            echo "Selected Xcode 16"
            echo "DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer" >> $GITHUB_ENV
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            echo "Selected Xcode 15.4"
            echo "DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer" >> $GITHUB_ENV
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS Workload
        run: |
          dotnet workload install ios --skip-manifest-update

      - name: Patch .NET iOS SDK Strict Xcode Check
        run: |
          python3 -c "
          import glob, re, os

          search_roots = [
              os.environ.get('DOTNET_ROOT', ''),
              '/Users/runner/.dotnet',
              '/usr/local/share/dotnet',
              os.path.expanduser('~/.dotnet')
          ]
          
          files_patched = 0
          for root in search_roots:
              if root and os.path.exists(root):
                  for path in glob.glob(f'{root}/**/*.targets', recursive=True):
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          new_content = re.sub(r'<Target\s+Name=[\"\']_CheckForInvalidXcodeVersion[\"\'][\s\S]*?</Target>', '<Target Name=\"_CheckForInvalidXcodeVersion\" />', content)
                          new_content = re.sub(r'<Target\s+Name=[\"\']_CheckForInvalidMacCatalystXcodeVersion[\"\'][\s\S]*?</Target>', '<Target Name=\"_CheckForInvalidMacCatalystXcodeVersion\" />', new_content)
                          new_content = re.sub(r'<CheckForInvalidXcodeVersion[\s\S]*?/>', '', new_content)
                          new_content = re.sub(r'<Error[^>]*This version of \.NET for iOS[^>]*/>', '', new_content)
                          if new_content != content:
                              with open(path, 'w', encoding='utf-8') as f:
                                  f.write(new_content)
                              print(f'Successfully patched: {path}')
                              files_patched += 1
                      except Exception as e:
                          print(f'Error patching {path}: {e}')
          print(f'Total target files patched: {files_patched}')
          "

      - name: Restore Dependencies
        run: |
          dotnet restore ComicDownloaderGMTPC.iOS/ComicDownloaderGMTPC.iOS.csproj

      - name: Build iOS App (Ad-Hoc Signed)
        run: |
          dotnet build ComicDownloaderGMTPC.iOS/ComicDownloaderGMTPC.iOS.csproj -c Release -r ios-arm64 --no-restore -v n -p:_SuppressXcodeVersionCheck=true -p:SuppressXcodeVersionCheck=true -p:CodesignKey="-" -p:EnableCodeSigning=true 2>&1 | tee build_log.txt
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== BUILD FAILED - RECENT ERRORS ==="
            grep -E "(error|Error|FAILED)" -C 3 build_log.txt || tail -n 100 build_log.txt
            exit $BUILD_STATUS
          fi

      - name: Package Unsigned / Ad-Hoc IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64 -type d -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found App Bundle at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r ComicDownloaderGMTPC-iOS-AdHoc.ipa Payload
          else
            APP_PATH=$(find ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64/publish -type d -name "*.app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              cp -R "$APP_PATH" Payload/
              zip -r ComicDownloaderGMTPC-iOS-AdHoc.ipa Payload
            else
              zip -r ComicDownloaderGMTPC-iOS-BuildOutput.zip ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64/
            fi
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-iOS
          path: |
            *.ipa
            ComicDownloaderGMTPC-iOS-BuildOutput.zip
          retention-days: 14

      - name: Upload Diagnostic Build Log (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Diagnostic-Build-Log
          path: build_log.txt
          retention-days: 7
