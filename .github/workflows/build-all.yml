name: Build All Platforms

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. WINDOWS STANDALONE X64 ──
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj

      - name: Build & Publish Windows x64 Single-File Executable
        run: >
          dotnet publish ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Windows-x64
          path: publish/windows/*.exe
          retention-days: 14

  # ── 2. LINUX STANDALONE X64 ──
  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj

      - name: Build & Publish Linux x64 Single-File Binary
        run: >
          dotnet publish ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Linux-x64
          path: publish/linux/ComicDownloaderGMTPC.Desktop
          retention-days: 14

  # ── 3. ANDROID APK ──
  build-android:
    name: Build Android (APK)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android Workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore Dependencies
        run: dotnet restore ComicDownloaderGMTPC.Android/ComicDownloaderGMTPC.Android.csproj

      - name: Build & Publish Android Release APK
        run: dotnet publish ComicDownloaderGMTPC.Android/ComicDownloaderGMTPC.Android.csproj -c Release -p:AndroidPackageFormat=apk

      - name: Prepare & Sign Android Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/android | Out-Null
          $apk = Get-ChildItem -Path ComicDownloaderGMTPC.Android/bin/Release -Filter "*Signed.apk" -Recurse | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path ComicDownloaderGMTPC.Android/bin/Release -Filter "*.apk" -Recurse | Select-Object -First 1
          }
          if ($apk) {
            Write-Host "Found Android APK at: $($apk.FullName)"
            Copy-Item -Path $apk.FullName -Destination "publish/android/ComicDownloaderGMTPC-Android-Signed.apk" -Force
            Write-Host "Successfully prepared: publish/android/ComicDownloaderGMTPC-Android-Signed.apk"
          } else {
            Write-Error "Error: No APK file found in build output!"
            exit 1
          }

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Android-APK
          path: publish/android/ComicDownloaderGMTPC-Android-Signed.apk
          retention-days: 14

  # ── 4. IOS APP & IPA ──
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Show & Select Xcode Toolchain & Link SDK Aliases
        run: |
          echo "=== Available Xcode versions ==="
          ls -ld /Applications/Xcode* || true
          
          XCODE_APP="/Applications/Xcode.app"
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | head -n 1)
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> $GITHUB_ENV
          xcode-select -p
          xcodebuild -version
          
          # Quét và tạo symlink aliases an toàn chống circular link cho mọi Apple SDK
          sudo python3 -c "
          import os, glob

          def safe_symlink(src_target, dst_link):
              try:
                  if os.path.islink(dst_link) or os.path.lexists(dst_link) or os.path.exists(dst_link):
                      if os.path.realpath(dst_link) == os.path.realpath(src_target):
                          return
                      os.unlink(dst_link)
                  os.symlink(src_target, dst_link)
                  print(f'  Linked: {os.path.basename(dst_link)} -> {src_target}')
              except Exception as e:
                  print(f'  Link error {dst_link}: {e}')

          for app in glob.glob('/Applications/Xcode*.app'):
              platforms_dir = os.path.join(app, 'Contents/Developer/Platforms')
              if not os.path.isdir(platforms_dir):
                  continue
              for platform in os.listdir(platforms_dir):
                  sdks_dir = os.path.join(platforms_dir, platform, 'Developer/SDKs')
                  if not os.path.isdir(sdks_dir):
                      continue
                  
                  # Tìm tất cả SDK thực sự tồn tại
                  real_sdks = []
                  for item in os.listdir(sdks_dir):
                      full_item = os.path.join(sdks_dir, item)
                      if item.endswith('.sdk'):
                          real_p = os.path.realpath(full_item)
                          if os.path.exists(real_p) and os.path.isdir(real_p):
                              real_sdks.append((item, real_p))
                  if not real_sdks:
                      continue
                  
                  real_sdks.sort(key=lambda x: (len(x[0]), not os.path.islink(os.path.join(sdks_dir, x[0]))), reverse=True)
                  best_name, best_real_path = real_sdks[0]
                  print(f'Platform {app}/{platform} -> using real SDK: {best_real_path}')
                  
                  if 'MacOSX' in platform:
                      prefix = 'MacOSX'
                  elif 'iPhoneSimulator' in platform:
                      prefix = 'iPhoneSimulator'
                  elif 'iPhoneOS' in platform:
                      prefix = 'iPhoneOS'
                  else:
                      prefix = platform.replace('.platform', '')
                  
                  # 1. Base canonical SDK link
                  safe_symlink(best_real_path, os.path.join(sdks_dir, f'{prefix}.sdk'))
                  
                  # 2. Version alias links (10.0 .. 27.9)
                  for major in range(10, 28):
                      for minor in ['', '.0', '.1', '.2', '.3', '.4', '.5', '.6']:
                          safe_symlink(best_real_path, os.path.join(sdks_dir, f'{prefix}{major}{minor}.sdk'))
          "
          
          echo "=== Verified Apple SDKs ==="
          xcrun --sdk macosx --show-sdk-path || true
          xcrun --sdk iphoneos --show-sdk-path || true
          xcodebuild -showsdks || true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS Workload
        run: |
          dotnet workload install ios --skip-manifest-update

      - name: Patch .NET iOS SDK Strict Xcode Check (With Root Privileges)
        run: |
          sudo python3 -c "
          import glob, re, os

          search_roots = [
              os.environ.get('DOTNET_ROOT', ''),
              '/Users/runner/.dotnet',
              '/usr/local/share/dotnet',
              '/Library/Frameworks',
              os.path.expanduser('~/.dotnet')
          ]
          
          files_patched = 0
          for root in search_roots:
              if root and os.path.exists(root):
                  for path in glob.glob(f'{root}/**/*.targets', recursive=True):
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          original = content
                          # 1. Nullify targets
                          content = re.sub(r'<Target\s+Name=[\"\']_CheckForInvalidXcodeVersion[\"\'][\s\S]*?</Target>', '<Target Name=\"_CheckForInvalidXcodeVersion\" />', content)
                          content = re.sub(r'<Target\s+Name=[\"\']_CheckForInvalidMacCatalystXcodeVersion[\"\'][\s\S]*?</Target>', '<Target Name=\"_CheckForInvalidMacCatalystXcodeVersion\" />', content)
                          content = re.sub(r'<Target\s+Name=[\"\']_ValidateXcodeVersion[\"\'][\s\S]*?</Target>', '<Target Name=\"_ValidateXcodeVersion\" />', content)
                          # 2. Strip task invocations (support both self-closing and separate closing tag)
                          content = re.sub(r'<CheckForInvalidXcodeVersion[\s\S]*?(?:/>|</CheckForInvalidXcodeVersion>)', '<!-- bypassed CheckForInvalidXcodeVersion -->', content)
                          content = re.sub(r'<ValidateXcodeVersion[\s\S]*?(?:/>|</ValidateXcodeVersion>)', '<!-- bypassed ValidateXcodeVersion -->', content)
                          # 3. Strip error tags mentioning Xcode
                          content = re.sub(r'<Error[^>]*Xcode[^>]*/>', '', content)
                          content = re.sub(r'<Error[^>]*This version of \.NET for iOS[^>]*/>', '', content)
                          if content != original:
                              with open(path, 'w', encoding='utf-8') as f:
                                  f.write(content)
                              print(f'Successfully patched: {path}')
                              files_patched += 1
                      except Exception as e:
                          print(f'Error patching {path}: {e}')
          print(f'Total target files patched: {files_patched}')
          "

      - name: Restore Dependencies
        run: |
          dotnet restore ComicDownloaderGMTPC.iOS/ComicDownloaderGMTPC.iOS.csproj

      - name: Build & Publish iOS App
        run: |
          dotnet publish ComicDownloaderGMTPC.iOS/ComicDownloaderGMTPC.iOS.csproj -c Release -r ios-arm64 -p:_SuppressXcodeVersionCheck=true -p:SuppressXcodeVersionCheck=true -p:EnableCodeSigning=false -p:CodesignKey="" -p:CodesignProvision="" -p:ServerAddress="" -p:ServerUser="" -p:ServerPassword=""

      - name: Package Unsigned / Ad-Hoc IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64 -type d -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64/publish -type d -name "*.app" 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found App Bundle at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            
            # Ad-Hoc sign the app bundle
            echo "Applying Ad-Hoc signature to app bundle..."
            codesign --force --deep --sign - "Payload/$(basename "$APP_PATH")" || true
            
            # Đóng gói tập tin .ipa
            zip -r ComicDownloaderGMTPC-iOS-AdHoc.ipa Payload
            echo "Successfully created ComicDownloaderGMTPC-iOS-AdHoc.ipa"
          else
            echo "Warning: .app directory not found, packaging raw bin folder"
            zip -r ComicDownloaderGMTPC-iOS-BuildOutput.zip ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64/
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-iOS
          path: |
            *.ipa
            ComicDownloaderGMTPC-iOS-BuildOutput.zip
          retention-days: 14

  # ── 5. PUBLISH RELEASE ASSETS TO GITHUB RELEASE ──
  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-linux, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Windows-x64
          path: release-temp/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Linux-x64
          path: release-temp/linux

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Android-APK
          path: release-temp/android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloaderGMTPC-iOS
          path: release-temp/ios

      - name: Organize & Standardize Release Assets
        run: |
          mkdir -p release-assets
          
          # Windows .exe
          find release-temp/windows -name "*.exe" -exec cp {} release-assets/ComicDownloaderGMTPC-Windows-x64.exe \;
          
          # Linux binary & tar.gz
          if [ -f "release-temp/linux/ComicDownloaderGMTPC.Desktop" ]; then
            chmod +x release-temp/linux/ComicDownloaderGMTPC.Desktop
            cp release-temp/linux/ComicDownloaderGMTPC.Desktop release-assets/ComicDownloaderGMTPC-Linux-x64
            tar -czvf release-assets/ComicDownloaderGMTPC-Linux-x64.tar.gz -C release-temp/linux ComicDownloaderGMTPC.Desktop
          fi
          
          # Android APK
          find release-temp/android -name "*.apk" -exec cp {} release-assets/ComicDownloaderGMTPC-Android-Signed.apk \;
          
          # iOS IPA
          find release-temp/ios -name "*.ipa" -exec cp {} release-assets/ComicDownloaderGMTPC-iOS-AdHoc.ipa \;

          echo "=== Prepared Release Assets ==="
          ls -la release-assets/

      - name: Upload All Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: releases
          name: "Comic Downloader GMTPC Multi-OS Releases"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

