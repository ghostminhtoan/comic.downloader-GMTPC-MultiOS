name: Build All Platforms (Windows, Linux, Android, iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── 1. WINDOWS STANDALONE EXE ──
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows Standalone Single-File
        run: |
          dotnet publish ComicDownloaderGMTPC.Desktop\ComicDownloaderGMTPC.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish\windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Windows-x64
          path: publish\windows\ComicDownloaderGMTPC.Desktop.exe
          retention-days: 14

  # ── 2. LINUX STANDALONE BINARY ──
  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux Standalone Single-File
        run: |
          dotnet publish ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Linux-x64
          path: publish/linux/ComicDownloaderGMTPC.Desktop
          retention-days: 14

  # ── 3. ANDROID APK PACKAGE ──
  build-android:
    name: Build Android (APK)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Workload
        run: |
          dotnet workload install android --skip-manifest-update

      - name: Build Android Release Package
        run: |
          dotnet build ComicDownloaderGMTPC.Android\ComicDownloaderGMTPC.Android.csproj -c Release -o publish\android

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Android-APK
          path: publish\android\*-Signed.apk
          retention-days: 14

  # ── 4. IOS APP & IPA ──
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Show & Select Xcode Toolchain
        run: |
          echo "=== Available Xcode versions ==="
          ls -ld /Applications/Xcode* || true
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | head -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting: $XCODE_16"
            sudo xcode-select -s "$XCODE_16"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS Workload
        run: |
          dotnet workload install ios --skip-manifest-update

      - name: Patch .NET iOS SDK Strict Xcode Check
        run: |
          python3 -c "
          import glob, re, os

          patterns = [
              os.path.expanduser('~/.dotnet/packs/Microsoft.iOS.Sdk*/**/*.targets'),
              '/Users/runner/.dotnet/packs/Microsoft.iOS.Sdk*/**/*.targets'
          ]
          
          files_patched = 0
          for pattern in patterns:
              for path in glob.glob(pattern, recursive=True):
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          text = f.read()
                      new_text = re.sub(r'<Error[^>]*This version of \.NET for iOS[^>]*/>', '<!-- Bypassed Xcode Version Error -->', text, flags=re.IGNORECASE)
                      new_text = re.sub(r'Name=[\"\']_CheckForInvalidXcodeVersion[\"\']', 'Name=\"_Bypassed_CheckForInvalidXcodeVersion\"', new_text)
                      new_text = re.sub(r'Name=[\"\']_CheckForInvalidMacCatalystXcodeVersion[\"\']', 'Name=\"_Bypassed_CheckForInvalidMacCatalystXcodeVersion\"', new_text)
                      if new_text != text:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_text)
                          print(f'Successfully patched: {path}')
                          files_patched += 1
                  except Exception as e:
                      print(f'Error processing {path}: {e}')
          print(f'Total targets patched: {files_patched}')
          "

      - name: Restore Dependencies
        run: |
          dotnet restore ComicDownloaderGMTPC.iOS/ComicDownloaderGMTPC.iOS.csproj

      - name: Build iOS App (Ad-Hoc Signed)
        run: |
          dotnet build ComicDownloaderGMTPC.iOS/ComicDownloaderGMTPC.iOS.csproj -c Release -r ios-arm64 --no-restore -p:_SuppressXcodeVersionCheck=true -p:SuppressXcodeVersionCheck=true -p:CodesignKey="-" -p:EnableCodeSigning=true

      - name: Package Unsigned / Ad-Hoc IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64 -type d -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found App Bundle at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r ComicDownloaderGMTPC-iOS-AdHoc.ipa Payload
          else
            APP_PATH=$(find ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64/publish -type d -name "*.app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              cp -R "$APP_PATH" Payload/
              zip -r ComicDownloaderGMTPC-iOS-AdHoc.ipa Payload
            else
              zip -r ComicDownloaderGMTPC-iOS-BuildOutput.zip ComicDownloaderGMTPC.iOS/bin/Release/net10.0-ios/ios-arm64/
            fi
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-iOS
          path: |
            *.ipa
            ComicDownloaderGMTPC-iOS-BuildOutput.zip
          retention-days: 14
