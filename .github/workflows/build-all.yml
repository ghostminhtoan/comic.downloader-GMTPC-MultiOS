name: Build All Platforms

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. WINDOWS STANDALONE X64 ──
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj

      - name: Build & Publish Windows x64 Single-File Executable
        run: >
          dotnet publish ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Windows-x64
          path: publish/windows/*.exe
          retention-days: 14

  # ── 2. LINUX STANDALONE X64 ──
  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj

      - name: Build & Publish Linux x64 Single-File Binary
        run: >
          dotnet publish ComicDownloaderGMTPC.Desktop/ComicDownloaderGMTPC.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Linux-x64
          path: publish/linux/ComicDownloaderGMTPC.Desktop
          retention-days: 14

  # ── 3. ANDROID APK ──
  build-android:
    name: Build Android (APK)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android Workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore Dependencies
        run: dotnet restore ComicDownloaderGMTPC.Android/ComicDownloaderGMTPC.Android.csproj

      - name: Build & Publish Android Release APK
        run: dotnet publish ComicDownloaderGMTPC.Android/ComicDownloaderGMTPC.Android.csproj -c Release -p:AndroidPackageFormat=apk

      - name: Prepare & Sign Android Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/android | Out-Null
          $apk = Get-ChildItem -Path ComicDownloaderGMTPC.Android/bin/Release -Filter "*Signed.apk" -Recurse | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path ComicDownloaderGMTPC.Android/bin/Release -Filter "*.apk" -Recurse | Select-Object -First 1
          }
          if ($apk) {
            Write-Host "Found Android APK at: $($apk.FullName)"
            Copy-Item -Path $apk.FullName -Destination "publish/android/ComicDownloaderGMTPC-Android-Signed.apk" -Force
            Write-Host "Successfully prepared: publish/android/ComicDownloaderGMTPC-Android-Signed.apk"
          } else {
            Write-Error "Error: No APK file found in build output!"
            exit 1
          }

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Android-APK
          path: publish/android/ComicDownloaderGMTPC-Android-Signed.apk
          retention-days: 14

  # ── 4. PUBLISH RELEASE ASSETS TO GITHUB RELEASE ──
  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Windows-x64
          path: release-temp/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Linux-x64
          path: release-temp/linux

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: ComicDownloaderGMTPC-Android-APK
          path: release-temp/android

      - name: Organize & Standardize Release Assets
        run: |
          mkdir -p release-assets
          
          # Windows .exe
          find release-temp/windows -name "*.exe" -exec cp {} release-assets/ComicDownloaderGMTPC-Windows-x64.exe \;
          
          # Linux binary & tar.gz
          if [ -f "release-temp/linux/ComicDownloaderGMTPC.Desktop" ]; then
            chmod +x release-temp/linux/ComicDownloaderGMTPC.Desktop
            cp release-temp/linux/ComicDownloaderGMTPC.Desktop release-assets/ComicDownloaderGMTPC-Linux-x64
            tar -czvf release-assets/ComicDownloaderGMTPC-Linux-x64.tar.gz -C release-temp/linux ComicDownloaderGMTPC.Desktop
          fi
          
          # Android APK
          find release-temp/android -name "*.apk" -exec cp {} release-assets/ComicDownloaderGMTPC-Android-Signed.apk \;

          echo "=== Prepared Release Assets ==="
          ls -la release-assets/

      - name: Upload All Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: releases
          name: "Comic Downloader GMTPC Multi-OS Releases"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
